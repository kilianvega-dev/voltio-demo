<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda · Voltio</title>
  <meta name="description" content="Todos los productos de Voltio: audio, carga, setup y wearables.">
  <meta name="theme-color" content="#07080A">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/lento.js"></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="shop">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="header" id="site-header"></header>

  <main id="main" class="wrap page">
    <div class="page__head">
      <h1 class="page__title">Tienda</h1>
      <p class="muted" id="shop-count" aria-live="polite"></p>
    </div>

    <div class="toolbar">
      <label class="search">
        <span class="sr-only">Buscar productos</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Busca audífonos, cargador, teclado…" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
      <label class="sort">
        <span>Ordenar</span>
        <select id="sort">
          <option value="relevance">Destacados</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="rating">Mejor calificados</option>
        </select>
      </label>
    </div>

    <div class="grid grid--shop" id="shop-grid"></div>
  </main>

  <footer class="footer" id="site-footer"></footer>
</body>
</html>
